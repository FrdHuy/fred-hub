<!doctype html><meta charset="utf-8"><title>扭蛋机 v2 · 六个方向</title>
<link rel="stylesheet" href="../../dist/tokens.css">
<style>
/* 扭蛋机视觉稿 v2：真正的三维体块（CSS 3D），光从左上；六个方向。鼠标在机器上移动可以轻轻转动视角。 */
*{box-sizing:border-box}
body{margin:0;background:#f8f7f4;color:#343832;font-family:var(--font-ui)}
.row{display:flex;width:1440px;height:900px;border-bottom:1px solid #e7e5de}
.cell{position:relative;flex:1;overflow:hidden}
.cell+.cell{border-left:1px solid #eeece6}
.tag{position:absolute;left:24px;top:18px;font:11px var(--font-mono);letter-spacing:.14em;color:#9a9d92;z-index:9}
.name{position:absolute;left:44px;bottom:112px;font:500 13px var(--font-mono);letter-spacing:.3em;color:#5d6258}
.desc{position:absolute;left:44px;right:44px;bottom:30px;font:12.5px/1.85 var(--font-ui);color:#7c8076}
.scene{position:absolute;inset:0 0 150px;perspective:1900px;perspective-origin:50% 42%}
.rig{position:absolute;left:50%;top:50%;transform-style:preserve-3d}
.pl{position:absolute;left:0;top:0;transform-origin:0 0;backface-visibility:hidden}
.pl.ds{backface-visibility:visible}
.g{position:absolute;left:0;top:0;width:0;height:0;transform-origin:0 0;transform-style:preserve-3d}
.lab{font:500 7px var(--font-mono);letter-spacing:.24em;color:#6b7065;white-space:nowrap}
.glyph{font:normal 9px/1 "Apple Symbols","Segoe UI Symbol",sans-serif;color:#565c52}

/* Capsules (billboards, always facing you): clear dome, the cup's shaded opening with the folded slip, the matte cup. */
.cap{--s:40px;--body:#efe9dc;--body-lo:#cfc6b2;--inner:#d8cfbc;position:absolute;left:0;top:0;width:var(--s);height:var(--s);border-radius:50%;transform-origin:50% 50%;
  background:radial-gradient(circle at 34% 26%,#fffffff2,#f7f5ef66 34%,#e9e6dc40 62%,#c9c5b866 100%);
  box-shadow:inset 0 0 0 .6px #3d3f2a2e,inset calc(var(--s)*-.04) calc(var(--s)*-.05) calc(var(--s)*.1) #3d3f2a1f,0 calc(var(--s)*.07) calc(var(--s)*.1) #3d3f2a33}
.cap.game{--body:#b3bcab;--body-lo:#8a9581;--inner:#9da896}
.cap .in{position:absolute;left:3%;right:3%;top:40%;height:20%;border-radius:50%;background:radial-gradient(ellipse at 50% 20%,color-mix(in srgb,var(--inner) 70%,#3d3f2a),var(--inner) 70%)}
.cap .in:before{content:'';position:absolute;left:38%;width:22%;bottom:40%;height:130%;opacity:.85;border-radius:1px;background:linear-gradient(#fdfbf5,#efe9da);box-shadow:0 0 0 .5px #3d3f2a26;transform:rotate(-6deg)}
.cap .out{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 36% 34%,color-mix(in srgb,var(--body) 70%,#fff),var(--body) 42%,var(--body-lo) 86%,color-mix(in srgb,var(--body-lo) 80%,#3d3f2a));
  -webkit-mask:radial-gradient(ellipse 47% 10% at 50% 50%,#0000 97%,#000 100%),linear-gradient(#0000 50%,#000 50%);-webkit-mask-composite:source-in;mask:radial-gradient(ellipse 47% 10% at 50% 50%,#0000 97%,#000 100%),linear-gradient(#0000 50%,#000 50%);mask-composite:intersect}
.cap .lip{position:absolute;left:3%;right:3%;top:40%;height:20%;border-radius:50%;border-bottom:calc(var(--s)*.018) solid #ffffffb3}
.cap:after{content:'';position:absolute;inset:0;border-radius:50%;background:radial-gradient(ellipse 46% 30% at 38% 22%,#ffffff8c,#fff0 70%)}
</style>
<body>
<div class="row"><div class="cell" id="v1"></div><div class="cell" id="v2"></div></div>
<div class="row"><div class="cell" id="v3"></div><div class="cell" id="v4"></div></div>
<div class="row"><div class="cell" id="v5"></div><div class="cell" id="v6"></div></div>
<script>
// ——— A small CSS-3D kit. World: x right, y down, z toward you; a rig is rotated rotateX(rx) rotateY(ry). ———
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const mix = (a, b, t) => '#' + hex(a).map((v, i) => Math.round(v + (hex(b)[i] - v) * t).toString(16).padStart(2, '0')).join('');
const lite = (c, t) => mix(c, '#ffffff', t), dark = (c, t) => mix(c, '#2a2b24', t);
function P(parent, x, y, z, w, h, rot = '', css = '', cls = '') {
  const e = document.createElement('div'); e.className = 'pl ' + cls;
  e.style.cssText = `width:${w}px;height:${h}px;transform:translate3d(${x}px,${y}px,${z}px) ${rot};${css}`;
  parent.append(e); return e;
}
function G(parent, x, y, z, rot = '') { const e = document.createElement('div'); e.className = 'g'; e.style.transform = `translate3d(${x}px,${y}px,${z}px) ${rot}`; parent.append(e); return e; }
// Matte plastic faces: lit from the upper left — tops brightest, fronts mid, right sides darker; soft edge highlights.
const FACE = {
  front: c => `background:linear-gradient(172deg,${lite(c, .35)},${c} 45%,${dark(c, .05)});box-shadow:inset 0 1.5px 0 #ffffffb0,inset 1.5px 0 0 #ffffff80,inset -1px 0 0 #00000012,inset 0 -1.5px 0 #0000001c`,
  top: c => `background:linear-gradient(180deg,${lite(c, .55)},${lite(c, .3)});box-shadow:inset 0 0 0 1px #ffffff90`,
  right: c => `background:linear-gradient(180deg,${dark(c, .1)},${dark(c, .2)});box-shadow:inset 1px 0 0 #ffffff50,inset 0 -1px 0 #0000001a`,
  left: c => `background:${dark(c, .3)}`, bottom: c => `background:${dark(c, .4)}`, back: c => `background:${dark(c, .25)}`,
};
// An axis-aligned box whose front face is at z, reaching back to z-d. `css` overrides a face; `mask` punches holes in the front.
function box(parent, { x = 0, y = 0, z, w, h, d, c = '#ece8dc', css = {}, mask = '', cls = '' }) {
  z ??= d / 2;   // bodies sit centred on the rig; parts pass their own z
  const f = (k, def) => (css[k] ?? def) + (k === 'front' && mask ? `;-webkit-mask:${mask};mask:${mask}` : '');
  return {
    front: P(parent, x, y, z, w, h, '', f('front', FACE.front(c)), cls),
    top: P(parent, x, y, z - d, w, d, 'rotateX(90deg)', f('top', FACE.top(c)), cls),
    right: P(parent, x + w, y, z, d, h, 'rotateY(90deg)', f('right', FACE.right(c)), cls),
    left: P(parent, x, y, z - d, d, h, 'rotateY(-90deg)', f('left', FACE.left(c)), cls),
    bottom: P(parent, x, y + h, z, w, d, 'rotateX(-90deg)', f('bottom', FACE.bottom(c)), cls),
    back: P(parent, x + w, y, z - d, w, h, 'rotateY(180deg)', f('back', FACE.back(c)), cls),
  };
}
// A rectangular recess behind a hole in a front face at z (walls face inward).
function recess(parent, x, y, w, h, z, depth, wall, backCss) {
  P(parent, x, y, z - depth, w, h, '', backCss);
  P(parent, x, y, z, w, depth, 'rotateX(-90deg)', `background:${dark(wall, .35)}`);
  P(parent, x, y + h, z - depth, w, depth, 'rotateX(90deg)', `background:linear-gradient(${dark(wall, .1)},${lite(wall, .1)})`);
  P(parent, x, y, z, depth, h, 'rotateY(90deg)', `background:linear-gradient(90deg,${dark(wall, .05)},${dark(wall, .25)})`);
  P(parent, x + w, y, z - depth, depth, h, 'rotateY(-90deg)', `background:linear-gradient(90deg,${dark(wall, .3)},${dark(wall, .15)})`);
}
// A cylinder along z (sticking out of a front face), from z0 to z0+len. Facets are shaded by the light from the upper left.
function cyl(parent, cx, cy, z0, r, len, { side = '#d6d3ca', cap = '', n = 28, ends = true, alpha = 1, ds = false } = {}) {
  const fw = 2 * r * Math.sin(Math.PI / n) + .6, ri = r * Math.cos(Math.PI / n);
  for (let i = 0; i < n; i++) {
    const t = i / n * 2 * Math.PI, lum = Math.cos(t - 1.25 * Math.PI);   // 1 = facing the light
    const col = lum > 0 ? lite(side, lum * .4) : dark(side, -lum * .35);
    P(parent, 0, 0, 0, len, fw, '', `background:${col};opacity:${alpha};transform:translate3d(${cx}px,${cy}px,${z0 + len}px) rotateZ(${t}rad) translateX(${ri}px) rotateY(90deg) translateY(${-fw / 2}px)`, ds ? 'ds' : '');
  }
  if (ends) return P(parent, cx - r, cy - r, z0 + len, 2 * r, 2 * r, '', `border-radius:50%;${cap || `background:radial-gradient(circle at 38% 32%,${lite(side, .45)},${side} 60%,${dark(side, .12)})`}`);
}
// Satin aluminium (lever A family) and the brick-red matte knob.
const SATIN = '#d9d7cf', SATIN_CAP = 'background:repeating-conic-gradient(#3d3f2a0d 0 .8deg,#fff0 .8deg 1.6deg),radial-gradient(circle at 38% 32%,#f6f4ee,#e0ddd4 46%,#cac7bd 76%,#b8b5ab);box-shadow:inset 0 .8px 0 #fff,0 0 0 .5px #8f8b7c80';
const RED = '#b34934', RED_CAP = 'background:radial-gradient(circle at 40% 36%,#c65a43,#b34934 58%,#9e3d2b);box-shadow:inset 0 .6px 0 #ffffff30';
function knob(parent, cx, cy, z, r, len) { cyl(parent, cx, cy, z, r, len, { side: RED, cap: RED_CAP, n: 20 }); }
// Evenodd SVG masks for holes: rounded rectangles and circles.
function holes(w, h, list) {
  const rr = ([x, y, hw, hh, r]) => `M${x + r} ${y}h${hw - 2 * r}a${r} ${r} 0 0 1 ${r} ${r}v${hh - 2 * r}a${r} ${r} 0 0 1 ${-r} ${r}h${-(hw - 2 * r)}a${r} ${r} 0 0 1 ${-r} ${-r}v${-(hh - 2 * r)}a${r} ${r} 0 0 1 ${r} ${-r}z`;
  const ci = ([cx, cy, r]) => `M${cx - r} ${cy}a${r} ${r} 0 1 0 ${2 * r} 0a${r} ${r} 0 1 0 ${-2 * r} 0z`;
  const d = `M0 0H${w}V${h}H0z` + list.map(s => s.length === 3 ? ci(s) : rr(s)).join('');
  return `url("data:image/svg+xml;utf8,${encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' width='${w}' height='${h}'><path fill-rule='evenodd' d='${d}'/></svg>`)}") 0 0/100% 100% no-repeat`;
}
// Capsules always face the camera (counter-rotated); they are re-aimed when the view tilts.
const boards = [];
function cap(rig, x, y, z, s, game = false, roll = 0) {
  const e = document.createElement('i'); e.className = 'cap' + (game ? ' game' : '');
  e.innerHTML = '<b class="in"></b><b class="out"></b><b class="lip"></b>'; e.style.setProperty('--s', s + 'px');
  e.dataset.t = `translate3d(${x - s / 2}px,${y - s / 2}px,${z}px)`; e.dataset.roll = roll;
  rig.append(e); boards.push({ e, rig }); return e;
}
function aim(rig) { const rx = +rig.dataset.rx, ry = +rig.dataset.ry; for (const b of boards) if (b.rig === rig) b.e.style.transform = `${b.e.dataset.t} rotateY(${-ry}deg) rotateX(${-rx}deg) rotate(${b.e.dataset.roll}deg)`; }
let seed = 11; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
// A floor shadow under a footprint.
function floor(rig, x, y, w, d, z) { P(rig, x - 60, y + .5, z - d - 60, w + 120, d + 120, 'rotateX(90deg)', 'background:radial-gradient(closest-side,#3d3f2a38,#3d3f2a14 60%,#3d3f2a00)'); }
// Printed marks lie on a face, a hair in front of it.
function print(parent, x, y, z, html, cls = 'lab', rot = '') { const e = P(parent, x, y, z + .4, 1, 1, rot, 'overflow:visible;width:auto;height:auto', cls); e.innerHTML = html; return e; }

function stage(id, W, H, { rx = -12, ry = -30, scale = 1, dy = 0 } = {}) {
  const cell = document.getElementById(id), scene = document.createElement('div'); scene.className = 'scene';
  const rig = document.createElement('div'); rig.className = 'rig'; rig.style.width = W + 'px'; rig.style.height = H + 'px';
  rig.dataset.rx = rx; rig.dataset.ry = ry; rig.dataset.scale = scale; rig.dataset.dy = dy;
  const place = () => { rig.style.transform = `translate(-50%,calc(-50% + ${dy}px)) scale(${scale}) rotateX(${rig.dataset.rx}deg) rotateY(${rig.dataset.ry}deg)`; aim(rig); };
  rig.place = place; scene.append(rig); cell.append(scene);
  cell.addEventListener('mousemove', e => { const r = cell.getBoundingClientRect(), u = (e.clientX - r.left) / r.width - .5, v = (e.clientY - r.top) / r.height - .5; rig.dataset.ry = ry + u * 22; rig.dataset.rx = rx - v * 10; place(); });
  cell.addEventListener('mouseleave', () => { rig.dataset.ry = ry; rig.dataset.rx = rx; place(); });
  return rig;
}
function words(id, tag, name, desc) { const c = document.getElementById(id); c.insertAdjacentHTML('beforeend', `<span class="tag">${tag}</span><span class="name">${name}</span><p class="desc">${desc}</p>`); }
const ZOD = [...'♈♉♊♋♌♍♎♏♐♑♒♓'].map(s => s + '︎');

// ——— V1 · OB-4：圆窗 + 彩色编码旋钮 ———
{
  const W = 300, H = 340, D = 150, Z = D / 2, c = '#e3dfd4', rig = stage('v1', W, H, { scale: 1.3, dy: 10 });
  floor(rig, 0, H, W, D, Z);
  P(rig, 150 - 120, 130 - 120, Z - 95, 240, 240, '', 'background:radial-gradient(circle at 45% 35%,#d9d4c6,#b3ad9d 80%)');
  for (let i = 0; i < 26; i++) { const a = rnd() * Math.PI * 2, rr = Math.sqrt(rnd()) * 70, x = 150 + Math.cos(a) * rr, y = 150 + Math.abs(Math.sin(a)) * rr * .7 - 10 * (i % 3); cap(rig, x, y, Z - 85 + (i % 4) * 16 + rnd() * 10, 46, false, (rnd() - .5) * 60); }
  box(rig, { w: W, h: H, d: D, c, mask: holes(W, H, [[150, 130, 92], [206, 248, 78, 50, 8]]) });
  cyl(rig, 150, 130, Z - 95, 92, 95, { side: '#bdb7a8', n: 56, ends: false, ds: true });
  // the porthole's bezel: a satin ring standing proud of the face
  cyl(rig, 150, 130, Z, 97, 7, { side: SATIN, n: 48, ends: false });
  P(rig, 150 - 97, 130 - 97, Z + 7, 194, 194, '', `border-radius:50%;${SATIN_CAP};-webkit-mask:radial-gradient(circle,#0000 91px,#000 91.5px);mask:radial-gradient(circle,#0000 91px,#000 91.5px)`);
  P(rig, 150 - 92, 130 - 92, Z + 5, 184, 184, '', 'border-radius:50%;background:linear-gradient(#ffffff2e,#fff0 40%,#fff0 75%,#ffffff12);box-shadow:inset 0 0 0 1px #ffffff55', 'ds');
  // chute
  recess(rig, 206, 248, 78, 50, Z, 46, '#8d887b', 'background:linear-gradient(#26282366,#3a3c35)');
  cap(rig, 250, 280, Z - 26, 38, false, 18);
  P(rig, 210, 250, Z - 3, 70, 30, 'rotateX(-18deg)', 'background:linear-gradient(#5a5e5588,#6c7066aa);box-shadow:inset 0 1px 0 #ffffff33', 'ds');
  // zodiac encoder: TE blue-grey, a white index line; the twelve signs printed around it
  cyl(rig, 58, 272, Z, 22, 20, { side: '#7d8fa0', n: 28, cap: 'background:radial-gradient(circle at 40% 34%,#9cadbd,#7d8fa0 60%,#6b7c8c);box-shadow:inset 0 .6px 0 #ffffff40' });
  P(rig, 57, 254, Z + 20.5, 2, 12, '', 'background:#f4f2ec;border-radius:1px');
  ZOD.forEach((g, i) => { const a = i / 12 * Math.PI * 2; print(rig, 58 + Math.sin(a) * 34 - 4, 272 - Math.cos(a) * 34 - 5, Z, g, 'glyph'); });
  // crank: satin plate, a satin bar, the red knob
  cyl(rig, 150, 272, Z, 38, 6, { side: SATIN, cap: SATIN_CAP, n: 36 });
  box(rig, { x: 108, y: 264, z: Z + 16, w: 84, h: 16, d: 10, c: '#dedcd5', css: { front: `background:linear-gradient(#f3f2ee,#d6d4cd);box-shadow:inset 0 1px 0 #fff,0 0 0 .5px #8f8b7c80`, top: 'background:#f1f0eb', right: 'background:#b9b6ad' } });
  cyl(rig, 150, 272, Z + 16, 9, 4, { side: SATIN, n: 18 });
  knob(rig, 182, 272, Z + 16, 11, 26);
  // numbered steps, printed small (TE style)
  print(rig, 24, 306, Z, '01 · SIGN'); print(rig, 124, 318, Z, '02 · TURN'); print(rig, 222, 306, Z, '03 · OUT');
  print(rig, 22, 18, Z, '<b style="font:600 12px var(--font-wordmark);letter-spacing:-.04em;color:#4f564a">Fred.</b>', 'lab');
  print(rig, 232, 20, Z, 'GACHA · 07');
  // the slide switch on the right side: a slot and a ribbed thumb
  P(rig, W + .5, 110, Z - 40, 70, 16, 'rotateY(90deg)', 'background:linear-gradient(#bdb8aa,#cfcabd);border-radius:8px;box-shadow:inset 0 2px 3px #3d3f2a40');
  const sw = G(rig, W, 104, Z - 44, 'rotateY(90deg)'); box(sw, { x: 0, y: 0, z: 8, w: 24, h: 28, d: 8, c: '#f1eee6' });
  print(rig, W + .6, 132, Z - 44, '签 · · · 游戏', 'lab', 'rotateY(90deg)');
  rig.place();
  words('v1', 'v2 · ① OB-4 · 圆窗', '① 圆窗 · 编码旋钮', '暖灰机身、一只缎面圆窗（像 TE 的 OB-4 音箱），窗里的扭蛋有前有后。控制排成一行、印着编号：01 星座旋钮（TE 式的灰蓝色编码器，一圈印着 12 个星座符号）· 02 扭把（缎面盘 + 横杆 + 红色握柄）· 03 出蛋口。滑块在右侧面。');
}

// ——— V2 · 小方块：Playdate 式侧摇把 ———
{
  const S = 210, Z = S / 2, c = '#e2bd58', rig = stage('v2', S, S, { rx: -20, ry: -34, scale: 1.45, dy: 20 });
  floor(rig, 0, S, S, S, Z);
  // inside, seen through the round hole in the top: a floor with capsules on it
  { const dk = 'background:linear-gradient(#5f5030,#7a6639)'; box(rig, { x: 4, y: 4, z: Z - 4, w: S - 8, h: 92, d: S - 8, cls: 'ds', css: { front: 'background:#0000', top: 'background:#0000', right: dk, left: dk, back: dk, bottom: 'background:radial-gradient(circle,#8a7442,#5a4b2c)' } }); }
  for (let i = 0; i < 12; i++) { const a = i / 12 * Math.PI * 2 + rnd(), rr = 20 + rnd() * 38; cap(rig, 105 + Math.cos(a) * rr * .8, 26 - (i % 3) * 14 + rr * .3, Math.sin(a) * rr * .8, 40, i % 4 === 0, (rnd() - .5) * 50); }
  const faces = box(rig, { w: S, h: S, d: S, c, mask: holes(S, S, [[40, 118, 130, 62, 10]]), css: {} });
  faces.top.style.cssText += `;-webkit-mask:${holes(S, S, [[105, 105, 70]])};mask:${holes(S, S, [[105, 105, 70]])}`;
  // a clear ring rim on the top
  P(rig, 105 - 76, -.6, -Z + 105 - 76, 152, 152, 'rotateX(90deg)', 'border-radius:50%;background:radial-gradient(circle,#0000 69px,#f3e2b1 70px,#e9d08c 76px)');
  // front: a small dot-matrix screen and two buttons
  P(rig, 40, 34, Z + .5, 130, 56, '', 'background:#2f332f;border-radius:6px;box-shadow:inset 0 2px 6px #000c,0 1px 0 #fff6');
  print(rig, 54, 48, Z + .5, `<span style="font:600 22px var(--font-mono);color:#c5d1b0;text-shadow:0 0 5px #c5d1b080">${ZOD[0]}</span><span style="margin-left:14px;font:500 11px var(--font-mono);letter-spacing:.3em;color:#c5d1b0">ARIES</span>`, 'lab');
  cyl(rig, 60, 102, Z, 6, 4, { side: '#f0ead8', n: 14 }); cyl(rig, 150, 102, Z, 6, 4, { side: '#f0ead8', n: 14 });
  print(rig, 76, 98, Z, '◂ SIGN ▸');
  // the chute
  recess(rig, 40, 118, 130, 62, Z, 56, '#9c8440', 'background:linear-gradient(#2c2618,#4a4026)');
  cap(rig, 110, 158, Z - 30, 40, false, -12);
  P(rig, 44, 120, Z - 3, 122, 34, 'rotateX(-16deg)', 'background:linear-gradient(#5a5e5577,#6c706699)', 'ds');
  // Playdate-style crank on the right side: an axle, a satin arm, the red knob parallel to the axle
  const g = G(rig, S, 70, -20, 'rotateY(90deg)');
  cyl(g, 0, 0, 0, 10, 12, { side: SATIN, cap: SATIN_CAP, n: 20 });
  box(g, { x: -9, y: -9, z: 20, w: 18, h: 84, d: 8, c: '#dcdad3', css: { front: 'background:linear-gradient(90deg,#c9c7c0,#f1f0eb 45%,#d2d0c9);box-shadow:0 0 0 .5px #8f8b7c80' } });
  knob(g, 0, 64, 20, 11, 28);
  // mode slider on the top, front-right
  P(rig, 150, -.6, Z - 40, 44, 16, 'rotateX(90deg)', 'background:#b99a45;border-radius:8px;box-shadow:inset 0 2px 3px #3d3f2a55');
  box(rig, { x: 152, y: -8, z: Z - 24, w: 16, h: 8, d: 16, c: '#f3ecd8' });
  rig.place();
  words('v2', 'v2 · ② 小方块', '② 小方块 · 侧摇把', '一只芥末黄的小方块（最大胆的一版，颜色借自网站翻牌屏的黄）。扭蛋从顶上的圆口看得到；右侧是 Playdate 那样的折叠摇把，红色握柄；正面一块点阵小屏显示星座，下面两颗小键切换；出蛋口在正面。滑块在顶上。');
}

// ——— V3 · 透明机芯 ———
{
  const W = 260, H = 380, D = 170, Z = D / 2, rig = stage('v3', W, H, { scale: 1.18, dy: 10 });
  floor(rig, 0, H, W, D, Z);
  // two hoppers behind a divider: warm-white 签 on the left, sage 游戏 on the right; the slider moves a gate between them
  for (let i = 0; i < 30; i++) { const left = i % 2 === 0, x = (left ? 26 : 140) + rnd() * 94, y = 200 - (i % 5) * 26 - rnd() * 10, z = -60 + rnd() * 120; cap(rig, x, y, z, 42, !left, (rnd() - .5) * 70); }
