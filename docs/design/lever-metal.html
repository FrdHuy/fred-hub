<!doctype html><meta charset="utf-8"><title>lever metal</title>
<link rel="stylesheet" href="./tokens.css">
<style>
body{margin:0;background:#f8f7f4;font-family:var(--font-ui)}
.v{position:relative;width:1440px;height:960px;overflow:hidden}
.tag{position:absolute;left:14px;top:10px;font:11px var(--font-mono);letter-spacing:.14em;color:#b0b2aa}
.lbl{position:absolute;font:500 11px var(--font-mono);letter-spacing:.3em;color:#8d9186}
.lev{--w:200px;position:relative;width:calc(var(--w)*.5);height:calc(var(--w)*.62);display:grid;place-items:center}
.plate{position:absolute;inset:0;border-radius:14px;background:linear-gradient(162deg,var(--shell-warm-hi),var(--shell-warm) 45%,var(--shell-warm-lo))}
.bezel{position:relative;width:calc(var(--w)*.14);aspect-ratio:1;border-radius:50%}
.bezel:before,.bezel:after{content:'';position:absolute;border-radius:50%}
.shadow{position:absolute;left:50%;top:50%;width:calc(var(--w)*.032);height:calc(var(--w)*.11);margin-left:calc(var(--w)*-.016);transform-origin:50% 0;border-radius:calc(var(--w)*.016);background:#3d3f2a;filter:blur(calc(var(--w)*.007));opacity:.42}
.bat{position:absolute;left:50%;top:50%;width:calc(var(--w)*.032);height:calc(var(--w)*.1);margin-left:calc(var(--w)*-.016);transform-origin:50% 0;clip-path:polygon(0 0,100% 0,82% 100%,18% 100%)}
.pivot{position:absolute;left:50%;top:50%;width:calc(var(--w)*.04);height:calc(var(--w)*.04);margin:calc(var(--w)*-.02) 0 0 calc(var(--w)*-.02);border-radius:50%}
.cap{position:absolute;left:50%;width:calc(var(--w)*.028);height:calc(var(--w)*.042);margin-left:calc(var(--w)*-.014);border-radius:calc(var(--w)*.014) calc(var(--w)*.014) calc(var(--w)*.006) calc(var(--w)*.006);background:linear-gradient(90deg,#8f3526,#b34934 30%,#c9624b 45%,#b34934 65%,#94382a);box-shadow:0 calc(var(--w)*.004) calc(var(--w)*.006) #3d3f2a47,inset 0 .5px 0 #ffffff38}

/* A: the previous "after" (satin, symmetric soft bands) */
.a .bezel{background:repeating-conic-gradient(#3d3f2a0a 0 2deg,#ffffff00 2deg 4deg),radial-gradient(circle at 38% 32%,#f7f5ef,#e2dfd6 46%,#cbc8be 76%,#b9b6ac);box-shadow:0 calc(var(--w)*.006) calc(var(--w)*.012) #3d3f2a38,0 0 0 .5px #8f8b7c80,inset 0 .6px 0 #fffffff0}
.a .bezel:before{inset:20%;background:radial-gradient(circle at 42% 36%,#f3f1eb,#d6d3ca 70%,#c2bfb5);box-shadow:inset 0 .5px 0 #fff,0 0 0 .5px #7d7b7459}
.a .bezel:after{inset:33%;background:radial-gradient(circle at 50% 42%,#1f221c,#3a3d37 90%);box-shadow:inset 0 1px 1.5px #000d}
.a .bat{background:linear-gradient(0deg,#ffffff00 60%,#ffffff33),linear-gradient(90deg,#8d8b84 0%,#b3b1aa 18%,#dcdad3 36%,#f3f2ee 46%,#e4e2dc 54%,#c4c2bb 72%,#a19f98 88%,#8d8b84 100%)}
.a .pivot{background:radial-gradient(circle at 38% 32%,#f4f3ef,#c8c6bf 45%,#8d8b84 80%,#6f6d67);box-shadow:0 .5px 1px #0006}

/* B: polished steel that reflects its surroundings — a sharp key light on the left, a dark band
   (the bushing and shadow), a warm bounce from the cream panel on the right, darker edges. */
.b .bezel{background:
  repeating-conic-gradient(#0000000f 0 1.5deg,#ffffff00 1.5deg 3deg),
  conic-gradient(from 200deg,#8a8781,#f7f6f2 40deg,#b9b6ae 80deg,#6f6c66 150deg,#9c998f 200deg,#e7e3d8 250deg,#a6a39b 300deg,#8a8781 360deg);
  box-shadow:0 calc(var(--w)*.006) calc(var(--w)*.012) #3d3f2a47,0 0 0 .6px #6f6c6699,inset 0 0 0 .6px #ffffff66}
.b .bezel:before{inset:18%;background:conic-gradient(from 210deg,#b5b2aa,#ffffff 35deg,#d9d7d0 70deg,#8e8b84 150deg,#c3c0b7 210deg,#f1ede3 250deg,#b9b6ae 320deg,#b5b2aa);box-shadow:0 0 0 .6px #5f5d5880,inset 0 0 0 .5px #ffffff80}
.b .bezel:after{inset:32%;background:radial-gradient(circle at 50% 40%,#141612,#30332d 90%);box-shadow:inset 0 1px 2px #000,0 0 0 .5px #ffffff59}
.b .bat{background:
  linear-gradient(0deg,#00000014,#0000 40%,#ffffff26),
  linear-gradient(90deg,#5f5d58 0%,#8e8c86 7%,#dcdad5 17%,#ffffff 23%,#f2f1ed 27%,#b1afa9 34%,#6c6a65 46%,#5a5853 52%,#7c7a74 60%,#b8b4aa 74%,#e2ddd0 82%,#a9a69e 91%,#6a6863 100%)}
.b .pivot{background:radial-gradient(circle at 36% 30%,#ffffff 0 7%,#e9e8e4 13%,#a8a6a0 30%,#5b5954 55%,#3e3c38 66%,#77746c 80%,#c9c3b5 92%,#8a877f);box-shadow:0 .6px 1px #000a,0 0 0 .4px #0005}
</style>
<body>
<section class="v"><span class="tag">人生清单拨杆 · A 上一版（缎面，对称柔光）/ B 新：抛光钢，映出环境（左侧锐利主光、深色反射带、右侧米色回光）· 放大 4 倍 + 实际尺寸</span>
<div class="lbl" style="left:370px;top:120px">A · 上一版</div><div class="lbl" style="left:960px;top:120px">B · 新</div>
<div id="big"></div>
<div class="lbl" style="left:440px;top:770px">实际尺寸 →</div><div id="small"></div>
</section>
<script>
const lever = cls => `<div class="lev ${cls}"><div class="plate"></div><div class="bezel"></div><div class="shadow" style="transform:translate(calc(var(--w)*.016),calc(var(--w)*.01)) rotate(180deg)"></div><div class="bat" style="transform:rotate(180deg)"></div><div class="pivot"></div><div class="cap" style="top:calc(50% - var(--w)*.1 - var(--w)*.012)"></div></div>`;
document.getElementById('big').innerHTML = `<div style="position:absolute;left:250px;top:170px;transform:scale(4);transform-origin:0 0">${lever('a')}</div><div style="position:absolute;left:820px;top:170px;transform:scale(4);transform-origin:0 0">${lever('b')}</div>`;
document.getElementById('small').innerHTML = `<div style="position:absolute;left:620px;top:740px;--w:280px" >${lever('a').replace('class="lev a"','class="lev a" style="--w:280px"')}</div><div style="position:absolute;left:800px;top:740px">${lever('b').replace('class="lev b"','class="lev b" style="--w:280px"')}</div>`;
</script>
