<body>
  <a class="skip-link" href="#collection-stage">跳到收藏</a>
  <div id="site">
    <header class="site-header">
      <span aria-hidden="true"></span>
      <a class="wordmark" href="#/" aria-label="Fred 返回收藏室">Fred<span class="wordmark-dot">.</span></a>
      <button class="module-menu-toggle" type="button" aria-label="所有收藏" aria-expanded="false" aria-controls="module-menu"><span></span><span></span></button>
